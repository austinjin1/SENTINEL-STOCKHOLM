# Part of SENTINEL v2
# PRE-REGISTERED SECONDARY ABLATION (protocol §7): no gauge-derived static inputs (StreamCat BFI / runoff dropped;
# elevation = StreamCat elevcat instead of the NWIS gauge datum). Models are suffixed '_nogauge'.
static_ablation: no_gauge_derived
name_suffix: _nogauge
models: [air2stream_regional, "dosat_ratio[air2stream_regional]", forcing_gbm]
refs: [doy_location_gbm, forcing_gbm, air2stream_regional]
# Matched tuning budget (review W5; protocol §8): forcing_gbm tries the same number of configurations as the
# EA-LSTM grid (3), each early-stopped on the same inner train-role rows; best per target by inner RMSE.
forcing_gbm_grid:
  - {max_rows_per_site: 1000}
  - {max_rows_per_site: 3000}
  - {max_rows_per_site: null}   # all train days
lgbm:
  num_leaves: 63
  learning_rate: 0.05
  n_estimators: 3000
  min_child_samples: 200
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  reg_lambda: 1.0
  early_stopping_rounds: 100
  n_jobs: 8             # CONTRIBUTING_V2: <= 8 CPU threads per job
  max_rows_per_site: 1000
  refit_full: true
air2stream:
  k_donors: 10
  iters: 300
  lr: 0.05
  min_obs: 365
  min_calib_nse: 0.5
  device: cpu           # cuda also works, but M6 holds at most one GPU and the EA-LSTM uses it
  threads: 4            # torch CPU threads during calibration
air2water_windows: [1, 3, 7, 14, 30]
smoke:
  forcing_gbm_grid:
    - {max_rows_per_site: 200}
    - {max_rows_per_site: null}
  lgbm:
    n_estimators: 400
    max_rows_per_site: 400
  air2stream:
    iters: 150

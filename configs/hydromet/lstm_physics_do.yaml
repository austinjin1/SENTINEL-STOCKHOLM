# Part of SENTINEL v2
# ABLATION: EA-LSTM with the physics-guided DO head (DO = DO_sat(T_pred) x learned ratio).
model: ealstm_physdo
seeds: [0, 1, 2]
iteration: cycle1        # RESEARCH_PLAN §15.5 improvement cycle 1 (protocol v0.5)
refs: [doy_location_gbm, forcing_gbm, air2stream_regional]
# no own grid: run with --hparams-from <ealstm run>/selection.json (pre-registered ablation, not tuned)
ealstm:
  seq_len: 365
  predict_last: 90
  hidden: 128
  static_emb: 32
  dropout: 0.2
  static_to_head: true
  head: gaussian
  physics_do: true
  detach_temp_for_do: false
  ratio_bounds: [0.2, 1.6]
  initial_forget_bias: 3.0
  batch_size: 256
  lr: 0.0005
  weight_decay: 1.0e-4
  max_epochs: 60
  steps_per_epoch: 200
  patience: 6
  grad_clip: 1.0
  val_max_windows: 4000
  early_stop_metric: mse      # inner point MSE of mu (NLL logged too)
  static_noise: 0.0           # overridden by the selected grid point
  site_sampling: target_share
  max_minutes: null         # protocol v0.5 (iteration cycle 1): no time cap; early stopping on inner point MSE (patience 6, <= 60 epochs)
smoke:
  seeds: [0, 1]
  ealstm:
    hidden: 64
    max_epochs: 4
    steps_per_epoch: 60
    patience: 2
    batch_size: 128
    val_max_windows: 600
    max_minutes: 8

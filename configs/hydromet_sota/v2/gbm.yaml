# M6 architecture v2 — GBM references G1 and G2 (PF-GBM) with the grab-sample formulation (amendment §5, §7).
# Counted configurations: 3 per reference (the grid below), every member early-stopped on the same inner rows.
# Seed 0 runs the grid and writes sota_v2/<arm>/selection.json (per primary target: form x grid point with the
# lowest standardised inner-sonde MSE, ties to the earlier grid point and derived before direct; hour-resolved
# output: per variable the grid point with the lowest term of J_grab, 30-day station cap). Seeds 1-2 and the
# no-grab variant fit the selected members only; nothing is selected again. Selected members are refitted on
# fit + inner rows with their iteration count; the reference is the mean over seeds 0-2.
model: gbm_ref
arms:
  g1: {inputs: [frozen_causal_features, solar_channels, vaa_statics]}                       # amendment §3
  g2: {inputs: [frozen_causal_features, solar_channels, vaa_statics, te_prior, stacks]}     # amendment §5
grid:
  p1: {max_rows_per_site: 3000, grab_share: 0.5}
  p2: {max_rows_per_site: 3000, grab_share: 0.25}
  p3: {max_rows_per_site: 1000, grab_share: 0.5}
# LightGBM settings of the frozen forcing_gbm_bag comparator (configs/hydromet/baselines_ws_gbmbag.yaml), unchanged.
lgbm:
  num_leaves: 63
  learning_rate: 0.05
  n_estimators: 3000
  min_child_samples: 200
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  reg_lambda: 1.0
  early_stopping_rounds: 100
n_jobs: 6                        # shared-host allocation: <= 6 threads, one heavy CPU job at a time
# G2 only. Stacked inputs: out-of-fold by basin group at the fit sites, full-fit model elsewhere (lever QStack).
stack: {targets: [logq, T_min, T_max, DO_max], n_folds: 5, max_rows_per_site: 1000}
# G2 only. Prior parameters of the equilibrium-temperature input (implementation constants, fixed before any fit;
# the same values as sentinel.hydromet_sota.thermox.physics.PRIOR and as D2's prior means).
te_prior: {shade: 0.3, wind_shelter: 0.6}
job_minutes: 100                 # a job stops before the next member after this time (exit 75); rerun to resume
seeds: [0, 1, 2]

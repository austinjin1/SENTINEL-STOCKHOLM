# Part of SENTINEL v2
# EW-v2 event heads (sentinel/models/sonde/events.py, sentinel/eval/ew_scoring.py).
model: events
hazards: [H1_hypoxia, H1_hypoxia_t4, H1_hypoxia_t2, H2_chloride, H2_chloride_acute, H4_nitrate, H5b_chl_bloom]
# H2 (lead-built derived chloride) and H4/H5b are flagged UNDERPOWERED on val/Test-A (protocol §9)
leads: [1, 3, 7]
min_train_onsets: 5           # skip direct classifiers for (hazard, lead) with fewer training onsets
quantile_models: {}           # name -> forecast directory of another run (val block), e.g. gbm: <run>/forecasts
naive_quantile_models: [damped_anomaly]   # always available (computed here)
quantile_combine: [max]
lstm_checkpoint: null         # path to an LSTM checkpoint -> logistic head on its frozen encoder
climatology: {K: 2, ridge: 5.0}
persistence: {n_bins: 20}
logistic: {C: 1.0}
lstm_head: {C: 0.1, max_train_rows: 400000}
# EW cycle 2 (2026-11-08, val only): optional feature blocks shared by every feature-based method
use_weather: true             # lagged OBSERVED weather summaries (issue-time available; no future weather)
# weather block only for runoff/salt-driven hazards (H2 chloride, H4 nitrate); for the DO hazards it was
# neutral-to-negative on val (ew_cyc2_wx_mono_stack vs ew_cyc1_subdaily, 2026-11-08), so it is off there
weather_vars: [cl_mgl_4dmean, cl_mgl_max, no3no2_mgl_mean]
use_subdaily: true            # hourly-tier DO features (DO hazards only)
# monotone variant of the event GBM (same features/params): P(onset) non-increasing in safe-side margins
event_gbm_mono:
  monotone: {margin_last: -1, margin_min7: -1, margin_max7: -1, sd_do_night_min: -1}
# stacked combination of feature-based methods (logistic on logit(raw p)), fitted on VAL like Platt
stack:
  members: [event_gbm, event_gbm_mono, logistic, persistence, climatology]
  C: 1.0
event_gbm:
  learning_rate: 0.03
  num_leaves: 31
  min_data_in_leaf: 200
  max_rounds: 1500
  early_stopping_rounds: 100
  num_threads: 6   # shared-host rule (CONTRIBUTING_V2: <= 6 threads)
  n_bags: 5        # seed bagging (2026-11-08): single-booster val BSS varied ~0.01 with thread count alone
ew:
  budget_per_30d: 1.0         # PRIMARY: alarm-days on valid non-onset days <= 1 per site per 30 d (pooled POFD <= 1/30), calibrated on VAL
  budget_sensitivity: 2.0     # sensitivity: 2/30 (episode counts are reported only as secondary descriptives)
  k_placebo: 20
  n_boot: 2000
smoke:
  ew:
    n_boot: 200
  event_gbm:
    max_rounds: 300
    early_stopping_rounds: 30
    num_threads: 6
